    });
    $('window-bar').addEventListener('pointerup',()=>drag=null);
    $('window-bar').addEventListener('pointercancel',()=>drag=null);
    // 12 Work 下拉菜单：点击、键盘方向键、Esc 和点外部都可操作；手机也使用同一顶栏。
    const menuWrap=$('work-menu-wrap'), menu=$('work-menu'), toggle=$('work-menu-toggle');
    function closeMenu(restoreFocus=true) {
      const wasOpen=!menu.hidden;
      menu.hidden=true;
      toggle.setAttribute('aria-expanded','false');
      if (wasOpen&&restoreFocus) toggle.focus({preventScroll:true});
    }
    function openMenu(focusItem=false,last=false) {
      menu.hidden=false;
      toggle.setAttribute('aria-expanded','true');
      if(focusItem) {
        const items=[...menu.querySelectorAll('button')];
        (last?items.at(-1):items[0]).focus({preventScroll:true});
      }
    }
    toggle.addEventListener('click',()=>{
      if(menu.hidden) openMenu(); else closeMenu();
    });
    toggle.addEventListener('keydown',event=>{
      if(event.key==='ArrowDown'||event.key==='ArrowUp') { event.preventDefault(); openMenu(true,event.key==='ArrowUp'); }
    });
    menu.addEventListener('keydown',event=>{
      if(!['ArrowDown','ArrowUp','Home','End'].includes(event.key)) return;
      event.preventDefault();
      const items=[...menu.querySelectorAll('button')], index=items.indexOf(document.activeElement);
      const next=event.key==='Home'?0:event.key==='End'?items.length-1:(index+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;
      items[next].focus({preventScroll:true});
    });
    menuWrap.addEventListener('focusout',event=>{if(!menuWrap.contains(event.relatedTarget)) closeMenu(false);});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!menu.hidden) { event.preventDefault(); closeMenu(); }});
    document.addEventListener('pointerdown',event=>{if(!menuWrap.contains(event.target)) closeMenu(false);});
    addEventListener('resize',()=>closeMenu(false),{passive:true});
    function updateClock() {
      const now=new Date();
      const time=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}).format(now);
      document.querySelectorAll('.live-clock').forEach(el=>{el.textContent=time; el.dateTime=now.toISOString();});
    }
    updateClock(); setInterval(updateClock,30000);
    document.querySelector('.hero-copy').addEventListener('animationend',event=>{if(event.animationName==='enter-copy'){clearTimeout(window.entranceFallback);document.documentElement.classList.remove('motion-pending');}});
    closeMenu(false); measure(); render();
    const initialHash=location.hash.slice(1);
    const initialView=({experience:'about',notes:'work'})[initialHash]||initialHash;
    if(VIEWS[initialView]) { setApp(initialView); if(initialView!==initialHash)writeRoute(initialView); requestAnimationFrame(()=>{recoveryArmed=false;scrollTo({top:distance,behavior:'instant'});}); }
    motion.addEventListener('change',requestRender);
  })();
  </script>
</body>
